[project]
name = "hexlet-code"
version = "0.1.0"
description = "Simple project with five brain-games"
readme = "README.md"
authors = [
    { name = "Polina Maksimovna", email = "polina.trofimova@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "prompt>=0.4.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_games"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[project.scripts]
brain-games = "brain_games.scripts.brain_games:main"
brain-even = "brain_games.scripts.games.brain_even:main"
brain-calc = "brain_games.scripts.games.brain_calc:main"
brain-gcd = "brain_games.scripts.games.brain_gcd:main"
brain-progression = "brain_games.scripts.games.brain_progression:main"
brain-prime = "brain_games.scripts.games.brain_prime:main"

